<rect width="1200" height="470" rx="20" fill="#f6f8fc"/>
<text x="40" y="42" font-family="Arial" font-size="23" font-weight="bold" fill="#16243a">CredResolve SmartDialer — Architecture</text>
<g font-family="Arial" text-anchor="middle" fill="#172033">
<rect x="35" y="95" width="155" height="72" rx="12" fill="#e3ebff" stroke="#6c8bd7"/><text x="112" y="124" font-size="15" font-weight="bold">Browser UI</text><text x="112" y="145" font-size="12">Dashboard</text>
<rect x="235" y="95" width="155" height="72" rx="12" fill="#e3ebff" stroke="#6c8bd7"/><text x="312" y="124" font-size="15" font-weight="bold">Python API</text><text x="312" y="145" font-size="12">HTTP handlers</text>
